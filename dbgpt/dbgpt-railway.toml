# DB-GPT configuration for the Railway template.
# Values come from the service's variables at start-up (${env:NAME:-default}).
[system]
language = "${env:DBGPT_LANG:-en}"
log_level = "${env:DBGPT_LOG_LEVEL:-INFO}"
api_keys = []
encrypt_key = "${env:DBGPT_ENCRYPT_KEY}"

[service.web]
# "::" listens on IPv6 and IPv4, so Railway's private network and health check both reach it.
host = "::"
port = "${env:PORT:-5670}"
cors_allowed_origins = "${env:DBGPT_CORS_ALLOWED_ORIGINS:-*}"

[service.web.agent_context]
max_context_tokens = 0
reserved_tokens = 4096
warning_threshold = 0.70
error_threshold = 0.90
critical_threshold = 0.95
min_keep_recent_rounds = 3
max_observation_age_rounds = 5
truncated_observation_max_chars = 200
min_keep_tokens = 10000
max_compact_failures = 3
max_parallel_subagents = 3
max_new_tokens = 16384

# Metadata (chats, apps, knowledge spaces, data sources, flows) lives in the MySQL service.
[service.web.database]
type = "mysql"
host = "${env:MYSQL_HOST}"
port = "${env:MYSQL_PORT:-3306}"
database = "${env:DBGPT_MYSQL_DATABASE:-dbgpt}"
user = "${env:MYSQL_USER:-root}"
password = "${env:MYSQL_PASSWORD}"

[service.model.worker]
host = "127.0.0.1"

# Vector store for knowledge bases: embedded Chroma under /app/pilot/data (on the volume).
[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-gpt-4o}"
provider = "${env:LLM_MODEL_PROVIDER:-proxy/openai}"
api_base = "${env:OPENAI_API_BASE:-https://api.openai.com/v1}"
api_key = "${env:OPENAI_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-text-embedding-3-small}"
provider = "${env:EMBEDDING_MODEL_PROVIDER:-proxy/openai}"
api_url = "${env:EMBEDDING_MODEL_API_URL:-https://api.openai.com/v1/embeddings}"
api_key = "${env:EMBEDDING_MODEL_API_KEY}"
